name: Update TORQUENAUT files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and install v3 files
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          z = zipfile.ZipFile('torquenaut-automation-starter-v3.zip')
          z.extractall('update-temp')

          root = Path('update-temp/torquenaut-starter')

          for name in ['factory.py', 'requirements.txt', 'README.md']:
              src = root / name
              if src.exists():
                  Path(name).write_bytes(src.read_bytes())

          workflow = root / '.github/workflows/daily.yml'
          target = Path('.github/workflows/daily.yml')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(workflow.read_bytes())
          PY

      - name: Commit updated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add factory.py requirements.txt README.md .github/workflows/daily.yml
          git commit -m "Update TORQUENAUT automation to v3" || echo "No changes"
          git push
