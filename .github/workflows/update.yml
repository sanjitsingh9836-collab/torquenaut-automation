name: Update Factory

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract factory ZIP
        run: |
          python - <<'PY'
          import zipfile
          import os
          import shutil
          import glob

          zip_files = glob.glob("*fixed.zip") + glob.glob("*v6*.zip")

          if not zip_files:
              zip_files = glob.glob("*.zip")

          if not zip_files:
              raise FileNotFoundError("No factory ZIP found in repository root")

          zip_path = zip_files[-1]
          print("Using ZIP:", zip_path)

          extract_dir = "update-temp"
          shutil.rmtree(extract_dir, ignore_errors=True)
          os.makedirs(extract_dir, exist_ok=True)

          with zipfile.ZipFile(zip_path, "r") as z:
              z.extractall(extract_dir)

          factory_files = glob.glob(
              os.path.join(extract_dir, "**", "factory.py"),
              recursive=True
          )

          if not factory_files:
              raise FileNotFoundError("factory.py not found inside ZIP")

          factory_path = factory_files[0]
          source_dir = os.path.dirname(factory_path)

          print("Factory found:", factory_path)

          for filename in ["factory.py", "requirements.txt", "README.md"]:
              source = os.path.join(source_dir, filename)

              if os.path.exists(source):
                  shutil.copy2(source, filename)
                  print("Updated:", filename)
              else:
                  print("Skipped missing:", filename)

          shutil.rmtree(extract_dir, ignore_errors=True)
          PY

      - name: Commit updated factory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add factory.py requirements.txt README.md

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update TORQUENAUT factory"
            git push
          fi
