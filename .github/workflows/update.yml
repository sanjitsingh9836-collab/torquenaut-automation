name: Update TORQUENAUT files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and install v3 files
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
with zipfile.ZipFile('torquenaut-automation-v4.zip') as z:
              z.extractall('update-temp')

          root = Path('update-temp/torquenaut-starter')

          for name in ['factory.py', 'requirements.txt', 'README.md']:
              src = root / name
              if not src.exists():
                  raise FileNotFoundError(str(src))
              Path(name).write_bytes(src.read_bytes())
          PY

      - name: Commit updated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add factory.py requirements.txt README.md
          git commit -m "Update TORQUENAUT automation to v3" || echo "No changes"
          git push
