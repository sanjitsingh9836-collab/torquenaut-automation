name: Update TORQUENAUT files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and install v4 files
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          zip_path = Path("torquenaut-automation-v5.zip")

          if not zip_path.exists():
              raise FileNotFoundError(
                  f"ZIP not found: {zip_path}. "
                  "Upload it to the root of the repository."
              )

          with zipfile.ZipFile(zip_path) as z:
              z.extractall("update-temp")

          root = Path("update-temp/torquenaut-starter")

          for name in ["factory.py", "requirements.txt", "README.md"]:
              src = root / name

              if not src.exists():
                  raise FileNotFoundError(f"Missing file inside ZIP: {src}")

              Path(name).write_bytes(src.read_bytes())

          print("TORQUENAUT v4 files installed successfully.")
          PY

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add factory.py requirements.txt README.md

          git commit -m "Update TORQUENAUT to v4" || echo "No changes to commit"

          git push
